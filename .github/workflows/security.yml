name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Python 3.12 tests and security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run offline regression tests
        run: python -m pytest -q

      - name: Compile application and tests
        run: python -m compileall -q app api scripts tests

      - name: Scan runtime code with Bandit
        run: python -m bandit -q -r app api scripts

      - name: Audit locked runtime dependencies
        run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements.txt
